<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WindIQ Ertrag</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 960px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    .muted { opacity: .7; }
  </style>
</head>
<body>
  <h1>WindIQ Ertrag</h1>
  {{if .NewestMeasurement.IsZero}}
    <p class="muted">Noch keine Messdaten geladen.</p>
  {{else}}
    <p>Neuester Messwert: {{.NewestMeasurement.UTC.Format "2006-01-02 15:04 MST"}}</p>
  {{end}}
</body>
</html>
